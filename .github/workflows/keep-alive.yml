name: Keep Streamlit app awake

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Visita o app para evitar hibernacao por inatividade
        run: |
          curl -sSL -o /dev/null -w "HTTP %{http_code}\n" \
            https://fluenciaeretracaoml.streamlit.app/ || true
